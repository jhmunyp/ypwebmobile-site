<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모바일 메인</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 배경 이미지 -->
  <div class="background"></div>

  <!-- 배너 -->
  <div class="slider" id="slider">
    <div class="slides" id="slides">
      <div class="slide"><img src="images/banner1.jpg" alt="배너1"></div>
      <div class="slide"><img src="images/banner2.jpg" alt="배너2"></div>
      <div class="slide"><img src="images/banner3.jpg" alt="배너3"></div>
    </div>

    <div class="dots" id="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <!-- 메뉴 -->
  <div class="container">
    <h1>자주 찾는 메뉴</h1>
    <p class="subtitle">원하시는 서비스를 바로 이용하세요</p>

    <div class="menu">
      <a href="#" class="menu-item" data-link="https://gilchkin.iyes.biz/">
        <img src="images/icon-checkin.png" alt="">
        <span class="text">객실체크인</span>
        <span class="arrow">〉</span>
      </a>

      <a href="#" class="menu-item" data-link="https://share.google/bIK4FIwg1I5erQH2F">
        <img src="images/icon-slope.png" alt="">
        <span class="text">슬로프 운영현황</span>
        <span class="arrow">〉</span>
      </a>

      <a href="#" class="menu-item" data-link="https://share.google/7f2YXXVf0fzdZeXil">
        <img src="images/icon-restaurant.png" alt="">
        <span class="text">식음/레저 운영정보</span>
        <span class="arrow">〉</span>
      </a>

      <a href="#" class="menu-item" data-link="https://share.google/NshHQboxiayUHrgPR">
        <img src="images/icon-shuttle.png" alt="">
        <span class="text">KTX·셔틀 운영안내</span>
        <span class="arrow">〉</span>
      </a>

      <a href="tel:01012345678" class="menu-item">
        <img src="images/icon-phone.png" alt="">
        <span class="text">골프예약 전화문의</span>
        <span class="arrow">〉</span>
      </a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
