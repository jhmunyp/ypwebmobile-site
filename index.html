<!DOCTYPE html>
<html lang="ko">
<head>

          <div class="slide"><img src="images/banner3.jpg" alt="배너 3"></div>
        </div>
      </div>

      <p class="subtitle">원하시는 서비스를 바로 이용하세요</p>

    <!-- 메뉴 -->
    <main class="container" aria-label="서비스 메뉴">
      <nav class="menu">

        <a href="https://share.google/7f2YXXVf0fzdZeXil">식음/레저 운영정보 <span>〉</span></a>

        <a href="#">추가 메뉴1 <span>〉</span></a>
        <a href="#">추가 메뉴2 <span>〉</span></a>
        <a href="#">추가 메뉴3 <span>〉</span></a>
        <a href="#">추가 메뉴4 <span>〉</span></a>
        <a href="#">추가 메뉴5 <span>〉</span></a>
        <a href="#">추가 메뉴6 <span>〉</span></a>

    <div class="menu-footer-gap" aria-hidden="true"></div>

    <!-- footer -->
    <footer class="footer-bar" aria-label="하단 고정 BI/CI">
      <a href="https://example.com/bi" class="footer-banner">
        <img src="images/CI/MONAYongPyongmallBI.jpg" alt="YongPyong Mall BI">
      </a>
      <a href="https://example.com/ci" class="footer-banner">
        <img src="images/CI/MONAYongPyongCI.jpg" alt="YongPyong CI">
      </a>
